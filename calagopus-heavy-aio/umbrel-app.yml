name: Calagopus Heavy AIO
version: "1.2.2"
tagline: A modern game server management panel built in Rust. Deploy, monitor,
  and manage Minecraft, Hytale, and other game servers with industry-leading performance.
icon: https://calagopus.com/logos/icon.svg
description: >-
  Calagopus is a modern, open-source game server management panel built with Rust and React. It provides a fast, secure interface for deploying, monitoring, and maintaining game servers - built for everyone from solo homelabbers to large hosting operators.

  It draws inspiration from Pterodactyl but is written from scratch in Rust, with a focus on performance, security, and extensibility. The panel includes a rich extension API and welcomes community contributions.

releaseNotes: |-
  Added:
  - Added support for shared file upload state
  - Added support for importing avatars from oauth providers
  - Added the ability to hide addresses in the panel
  - Added support for disabling activity ip viewing for certain groups
  - Added new empty table design with a CTA
  - Added support for mass-statting paths
  - Added file upload conflict warnings
  - Added ability to fully disable password logins
  - Added missing backup deletion/force deletion switch on mass-admin-server-actions

  Fixed:
  - Fixed some possible performance issues
  - Fixed breakpoints in virtual windows not working properly
  - Fixed self-reporting memory usage including non-RSS usage
  …
