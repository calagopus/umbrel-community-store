  - Added new empty table design with a CTA
  - Added support for mass-statting paths
  - Added file upload conflict warnings
  - Added ability to fully disable password logins
  - Added missing backup deletion/force deletion switch on mass-admin-server-actions

  Fixed:
  - Fixed some possible performance issues
  - Fixed breakpoints in virtual windows not working properly
  - Fixed self-reporting memory usage including non-RSS usage
