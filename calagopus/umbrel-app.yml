  - Added new command to make migrating storage driver to s3 easier

  Fixed:
  - Fixed restic prunes still running on backup configs with maintenance enabled
  - Fixed avatar fallback being hardcoded to Calagopus Icon
  - Fixed webmanifest hardcoding Calagopus references
  - Fixed wasm load error on mobile file editing with the pierre editor
  - Fixed page crash bug on certain unfinished translation items
