version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: calagopus_web_1
      APP_PORT: 8000

  web:
    image: ghcr.io/calagopus/panel:1.2.2@sha256:ea0ccf8672ea516830c5a24b58f4c427c57ff8815486e6f4cc336478d1fd5005
    restart: on-failure
    stop_grace_period: 1m
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    environment:
      TZ: Europe/Berlin
      REDIS_URL: redis://cache
      DATABASE_URL: postgresql://panel:panel@db/panel
      DATABASE_MIGRATE: "true"
      PORT: "8000"
      DOCKER_HOST: unix:///var/run/docker.sock
      APP_DEBUG: "false"
      APP_LOG_DIRECTORY: /var/log/calagopus
      APP_PRIMARY: "true"
      APP_ENABLE_WINGS_PROXY: "true"
      APP_ENCRYPTION_KEY: ${APP_SEED}
      APP_TRUSTED_PROXIES: ${NETWORK_IP}/16
      APP_USE_DECRYPTION_CACHE: "true"
      APP_USE_INTERNAL_CACHE: "true"
    volumes:
      # --- panel
      - ${APP_DATA_DIR}/data/panel:/var/lib/calagopus
      - ${APP_DATA_DIR}/data/logs:/var/log/calagopus
    ports:
      - "8000:8000"
      - "2022:2022"

  db:
    image: ghcr.io/calagopus/pgautoupgrade:18.4-alpine@sha256:65a9f085cd81a93b7f38bc49651d0a6c7183e36984dcee9b1a3c5ddf3c1e319c
    restart: on-failure
    environment:
      TZ: Europe/Berlin
      POSTGRES_USER: panel
      POSTGRES_PASSWORD: panel
      POSTGRES_DB: panel
      PGDATA: /data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panel -d panel"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/data

  cache:
    image: ghcr.io/calagopus/valkey:9.1.1@sha256:48267fca9907c48d9654b8c3f85fe7b851585743107460bc27c1949a25251f7a
    restart: on-failure
    command: --protected-mode no --save 60 1
    environment:
      TZ: Europe/Berlin
    volumes:
      - ${APP_DATA_DIR}/data/cache:/data
